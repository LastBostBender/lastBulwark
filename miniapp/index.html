<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Último Bastión</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <!-- Fuente base (opcional, pero ayuda a la estética) -->
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
    }
    .btn-outline-light {
      border-color: #444;
      color: #ccc;
    }
    .btn-outline-light:hover {
      background-color: #333;
      border-color: #666;
      color: #fff;
    }
    /* Espacio para futuros estilos personalizados */
  </style>
</head>
<body>

  <!-- Contenedor principal donde React montará la aplicación -->
  <div id="root"></div>

  <!-- Bootstrap 5 JavaScript Bundle (necesario para componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!-- El resto del código de React irá en archivos .tsx que importaremos después -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
